---
- name: Debian | Enable sudo without password (Debian)
  lineinfile: "dest=/etc/sudoers backrefs=yes regexp='^%sudo\\s+ALL=\\(ALL:ALL\\)\\s+ALL' line='%sudo\\tALL=(ALL) NOPASSWD: ALL'"

- name: Debian | Install packages
  apt:
    update_cache: true
    cache_valid_time: 3600
    pkg:
    - rsync
    - less
    - mc
    - acl
    - curl
    - links
    - lynx
    - vim
    - lsof
    - ssh
    - bind9-host
    - htop
    - ntpsec
    - git
    - iotop
    - make
    - zip
    - unzip
    - tshark
    - sysstat

- name: Debian | Configure locales
  locale_gen: name={{ item }} state=present
  with_items:
    - en_US.UTF-8

- name: Debian | Set default locale to en_US.UTF-8
  debconf: name=locales question='locales/default_environment_locale' value=en_US.UTF-8 vtype='select'
  notify: Reconfigure locales

- name: Debian | Update the motd file
  template: src=motd.j2 dest=/etc/motd owner=root group=root mode=0644

- name: Debian | Setup global vimrc
  template: src=vimrc-local.j2 dest=/etc/vim/vimrc.local owner=root group=root mode=0644

- name: Debian | Set timezone to Etc/UTC
  timezone: name="Etc/UTC"

- name: Disable some ubuntu dynamic motd
  file: path="/etc/update-motd.d/{{ item }}" mode="a-x"
  with_items:
    - 00-header
    - 10-help-text
    - 50-motd-news
    - 90-updates-available
  failed_when: False

- name: Remove some packages
  apt:
    pkg:
      - landscape-common
    state: absent
    autoremove: true

- name: Create local bin directory on skel
  file: path="/etc/skel/.local/bin" state=directory

- name: Upload local .bashrc_local on skel
  template: src=bashrc_local.j2 dest="/etc/skel/.bashrc_local"

- name: Enable .bashrc_local
  lineinfile: dest=/etc/skel/.bashrc regexp="^test -e ~/.bashrc_local" line="test -e ~/.bashrc_local && . ~/.bashrc_local" state=present

- name: Globally add user local bin path
  copy:
    dest: "/etc/profile.d/local_bin_path.sh"
    content: "export PATH=$PATH:$HOME/.local/bin"

- name: Disable ipv6
  sysctl: name={{ item.name }} value={{ item.value }} state=present ignoreerrors=yes
  with_items:
    - { name: 'net.ipv6.conf.all.disable_ipv6', value: 1 }
    - { name: 'net.ipv6.conf.default.disable_ipv6', value: 1 }
    - { name: 'net.ipv6.conf.lo.disable_ipv6', value: 1 }
