---
# Tools to install
utils_tools:
  - kubectl
  - helm
  - stern
  - k9s
  - kind
  - sofka

# Versions: "latest" resolves the newest release at run time,
# or pin a specific one (with or without leading "v"), e.g. "1.31.2"
utils_kubectl_version: latest
utils_helm_version: latest
utils_stern_version: latest
utils_k9s_version: latest
utils_kind_version: latest
utils_sofka_version: latest

utils_bin_dir: /usr/local/bin

# Tools already present in utils_bin_dir are skipped; set true to re-install
utils_force: false
